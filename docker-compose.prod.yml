name: shop-prod

x-app: &app
  image: shop-web:${APP_VERSION:?Set APP_VERSION in .env.prod}
  build:
    context: .
    target: prod
  env_file: .env.prod
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    EMAIL_HOST: mailpit
    EMAIL_PORT: 1025

services:
  worker:
    <<: *app
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    entrypoint: []
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      DB_CONN_MAX_AGE: "0"
    dns_opt: ["timeout:1", "attempts:1"]
    restart: unless-stopped
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: shop-nginx:${APP_VERSION:?Set APP_VERSION in .env.prod}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        APP_VERSION: ${APP_VERSION:?Set APP_VERSION in .env.prod}
    restart: unless-stopped
    environment:
      SUPPORT_PHONE: ${SUPPORT_PHONE:-+7 800 555-35-35}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --header='Host: localhost' -O /dev/null https://127.0.0.1/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025"

  site-check:
    image: shop-nginx:${APP_VERSION:?Set APP_VERSION in .env.prod}
    profiles: ["checks"]
    entrypoint: ["wget"]
    command: ["-q", "--no-check-certificate", "--header=Host: localhost", "-O", "/dev/null", "https://nginx/healthz/"]
    restart: "no"
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  redis_data:
  pgdata:
  static_data:
  media_data:
