repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: frontend-lint
        name: oxlint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/(src/|\.oxlintrc\.json$|package(-lock)?\.json$)
        pass_filenames: false
      - id: frontend-typecheck
        name: tsc (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/(src/|tsconfig|(?:vite|vitest)\.config\.ts$|package(-lock)?\.json$)
        pass_filenames: false
