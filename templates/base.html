<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Магазин{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'catalog:product_list' %}">Магазин</a>
    <form class="d-flex me-auto" action="{% url 'catalog:product_list' %}" method="get">
      <input class="form-control me-2" type="search" name="q" placeholder="Поиск товаров"
             value="{{ request.GET.q }}">
    </form>
    <ul class="navbar-nav">
      {% if user.is_authenticated %}
        <li class="nav-item"><span class="nav-link">{{ user.username }}</span></li>
        <li class="nav-item">
          <form action="{% url 'logout' %}" method="post">{% csrf_token %}
            <button class="btn btn-link nav-link">Выйти</button>
          </form>
        </li>
      {% else %}
        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Войти</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'signup' %}">Регистрация</a></li>
      {% endif %}
    </ul>
  </div>
</nav>
<main class="container">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
