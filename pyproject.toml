[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# в dev.py/prod.py переменные приходят из base.py через import *
"config/settings/*.py" = ["F405"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "config/*", "manage.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
