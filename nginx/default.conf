log_format shop_json escape=json '{"time":"$time_iso8601","level":"INFO","logger":"nginx","message":"$request","request_id":"$request_id","status":$status,"path":"$uri"}';
access_log /var/log/nginx/access.log shop_json;

upstream django {
    zone django 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server web:8000 resolve;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;
    add_header X-Request-ID $request_id always;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_redirect off;
    }
}
