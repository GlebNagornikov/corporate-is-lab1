log_format shop_json escape=json '{"time":"$time_iso8601","level":"INFO","logger":"nginx","message":"$request","request_id":"$request_id","status":$status,"path":"$uri"}';
access_log /var/log/nginx/access.log shop_json;

map $http_host $django_host {
    default $http_host;
    '' $host;
}

upstream django {
    zone django 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server web:8000 resolve;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;
    add_header X-Request-ID $request_id always;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
    }

    # Публичный платёжный webhook использует отдельный путь вне /api/.
    location ~ ^/(?:(?:api|admin|healthz)(?:/|$)|payments/webhook/?$) {
        proxy_pass http://django;
        proxy_set_header Host $django_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_redirect off;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $request_id always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Request-ID $request_id always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Request-ID $request_id always;
    }
}
